{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kairos.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kairos.labels" . | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
    {{- if eq .Values.ingress.entrypoint "cloudfront" }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/inbound-cidrs: "127.0.0.1/32"
    alb.ingress.kubernetes.io/security-group-prefix-lists: {{ required "CloudFront exige prefix list" .Values.ingress.cloudfrontPrefixListId | quote }}
    {{- else }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: {{ required "ingress.certificateArn e obrigatorio para HTTPS" .Values.ingress.certificateArn | quote }}
    {{- end }}
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.health.readinessPath | quote }}
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/target-group-attributes: "deregistration_delay.timeout_seconds=30"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{ if ne .Values.ingress.entrypoint "cloudfront" }}host: {{ required "ingress.host e obrigatorio" .Values.ingress.host | quote }}
      {{ end }}http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "kairos.name" . }}
                port:
                  name: http
{{- end }}
