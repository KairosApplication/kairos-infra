{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.allowedPodLabels }}
{{- fail "Defina allowedPodLabels para restringir consumidores." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kairos.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "kairos.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.allowedNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.allowedPodLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
{{- end }}
