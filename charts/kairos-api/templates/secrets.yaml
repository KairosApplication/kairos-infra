{{- if .Values.secrets.enabled }}
{{- $keys := required "secrets.keys precisa conter as chaves do JSON no Secrets Manager" .Values.secrets.keys }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "kairos.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kairos.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    region: {{ required "aws.region e obrigatorio" .Values.aws.region | quote }}
    usePodIdentity: "true"
    objects: |
      - objectName: {{ required "secrets.name e obrigatorio" .Values.secrets.name | quote }}
        objectType: secretsmanager
        jmesPath:
        {{- range $keys }}
          - path: {{ printf "\"%s\"" . | quote }}
            objectAlias: {{ . | quote }}
            filePermission: "0444"
        {{- end }}
  secretObjects:
    - secretName: {{ include "kairos.name" . }}-env
      type: Opaque
      data:
        {{- range $keys }}
        - objectName: {{ . | quote }}
          key: {{ . | quote }}
        {{- end }}
{{- end }}
