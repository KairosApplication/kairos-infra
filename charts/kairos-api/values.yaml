replicaCount: 1
availability:
  requireSeparateNodes: false
image:
  repository: ""
  digest: ""
serviceAccount:
  name: kairos-runtime
containerPort: 8080
service:
  port: 80
env: {}
sourceRevision: ""
aws:
  region: ""
secrets:
  enabled: true
  name: ""
  keys: []
ingress:
  enabled: false
  className: kairos-public
  host: ""
  certificateArn: ""
health:
  readinessPath: /health
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
networkPolicy:
  enabled: false
  allowedNamespace: kairos-agent-client
  allowedPodLabels:
    app.kubernetes.io/name: kairos-agent
