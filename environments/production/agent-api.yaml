# API MongoDB consumida pelo agente de IA. Sem credenciais neste arquivo.
replicaCount: 1
containerPort: 8081
env:
  API_PORT: "8081"
  APP_MONGODB_VERIFY_ON_STARTUP: "true"
  APP_MONGODB_WRITES_ENABLED: "false"
  SERVER_SHUTDOWN: graceful
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 25s
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0"
secrets:
  name: kairos/production/agent-api
  keys: [MONGODB_URI, MONGODB_DATABASE, API_ACCESS_TOKEN]
ingress:
  enabled: true
  entrypoint: cloudfront
  className: kairos-cloudfront
networkPolicy:
  enabled: false
  allowedNamespace: kairos-mobile-api
  allowedPodLabels:
    kairos.io/consumer: mobile-api
